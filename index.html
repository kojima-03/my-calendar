<head>

<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#222;--sub:#777;--line:#e3e3df;--accent:#2f6fed;--task:#d9822b;--today:#e8f0ff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#222426;--text:#eee;--sub:#999;--line:#34373a;--accent:#6c9bff;--task:#f0a050;--today:#243350;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181a;--card:#222426;--text:#eee;--sub:#999;--line:#34373a;--accent:#6c9bff;--task:#f0a050;--today:#243350;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding:12px}
.wrap{max-width:960px;margin:0 auto;display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:800px){.wrap{grid-template-columns:2fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.head h2{flex:1;margin:0;font-size:18px;text-align:center}
button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.dow{text-align:center;font-size:12px;color:var(--sub);padding:2px}
.day{min-height:84px;border:1px solid var(--line);border-radius:6px;padding:3px;cursor:pointer;overflow:hidden;background:var(--daybg,transparent);color:var(--daytx,inherit)}
.day.other{opacity:.4}.day.today{background:var(--today)}.day.sel{outline:2px solid var(--accent)}
.num{font-size:12px;color:var(--daysub,var(--sub))}
.item{display:flex;align-items:center;gap:3px;font-size:11px;line-height:1.3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev{background:var(--accent);color:#fff;border-radius:3px;padding:0 3px;display:block;overflow:hidden;text-overflow:ellipsis}
.tk{color:var(--task)}
.tk input{margin:0;width:13px;height:13px;accent-color:var(--task);flex:none}
.tk span{overflow:hidden;text-overflow:ellipsis}
.more{font-size:10px;color:var(--sub)}
h3{margin:12px 0 6px;font-size:14px}
.row{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}.row small{color:var(--sub)}
.over{color:#d33}
label{display:block;font-size:12px;color:var(--sub);margin-top:8px}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px}
.seg{display:flex;gap:6px}.seg button{flex:1}.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.empty{color:var(--sub);font-size:13px}
  



#viewTabs {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  box-sizing: border-box;
  grid-column: 1 / -1;
  margin-bottom: 12px;
  padding: 4px;
  border-radius: 999px;
  background: color-mix(in srgb,var(--text) 7%,transparent);
  height: 40px;
}

#viewTabs button {
  flex: 1 1 0;
  min-width: 0;
  width: auto;
  height: auto;
  padding: 8px 12px;
  border: 0;
  border-radius: 999px;
  font-size: 14px;
  line-height: 1.4;
  font-weight: 400;
  transform: none;
}

#viewTabs button.on {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 2px 8px color-mix(in srgb,var(--accent) 40%,transparent);
  transform: none;
}



.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.mcard{width:100%;max-width:420px;max-height:80vh;overflow:auto;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:14px}
.sw{width:30px;height:30px;padding:0;border-radius:50%}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;font-size:28px;line-height:1;padding:0;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#formModal{align-items:flex-end}
#formModal .mcard{max-width:520px;max-height:90vh;border-radius:16px 16px 0 0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
@media(min-width:800px){#formModal{align-items:center}#formModal .mcard{border-radius:12px;max-width:420px}}

@media(max-width:600px){
  body{padding:8px}
  .day{min-height:64px}
  .item{font-size:10px}
  #dayList .row{padding:10px 0;gap:8px}
  #dayList .row .t{font-size:14px}
  #dayList .row button{padding:7px 10px}
}

:root{--accent:#5468f0;--task:#e8890c;--line:#e8e6e1}
body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;background:linear-gradient(160deg,var(--bg),color-mix(in srgb,var(--accent) 7%,var(--bg))) fixed;min-height:100vh}
.card{border-radius:20px;border:1px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:0 10px 30px rgba(30,40,80,.07);padding:16px}
.head h2{font-size:21px;letter-spacing:.06em;font-weight:700}
.head button{width:38px;height:38px;padding:0;border-radius:50%;font-size:18px;line-height:1}
#today{width:auto;padding:0 14px;border-radius:999px;font-size:13px}
button{border-radius:999px;transition:transform .12s,box-shadow .12s,background .15s}
button:active{transform:scale(.96)}
button.primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 65%,#9b5cf6));border:0;color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 40%,transparent)}
.seg{background:color-mix(in srgb,var(--text) 7%,transparent);padding:4px;border-radius:999px}
.seg button{border:0;background:transparent}
.seg button.on{background:var(--accent);color:#fff;box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 40%,transparent)}
input[type=text],input[type=date],input[type=time],select,textarea{border-radius:12px;padding:9px 11px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.grid{gap:5px}
.dow{font-size:12px;font-weight:700;letter-spacing:.05em;padding:4px 0}
.dow:nth-child(7n+1){color:#e5575c}.dow:nth-child(7n){color:#4a8cf0}
.day{border-radius:14px;border:1px solid transparent;background:var(--daybg,color-mix(in srgb,var(--text) 3.5%,transparent));transition:background .15s,border-color .15s}
.day:hover{border-color:var(--line)}
.num{font-size:12px;font-weight:700;margin:1px 0 2px 2px}
.day:nth-child(7n+1) .num{color:#e5575c}.day:nth-child(7n) .num{color:#4a8cf0}
.day.sel{outline:2px solid var(--accent);outline-offset:-2px}
.day.today{background:var(--today)}
.day.today .num{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:#fff}
.ev{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);border-left:3px solid var(--accent);border-radius:5px;font-weight:700;padding:1px 4px}
.ev[style]{background:color-mix(in srgb,#2e9d6b 17%,transparent)!important;color:#2e9d6b;border-left-color:#2e9d6b}
.card>h3{font-size:12px;letter-spacing:.1em;color:var(--sub);font-weight:700;margin:18px 0 6px}
.row{border-bottom:1px dashed var(--line);padding:7px 0}
.modal{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);animation:fadein .18s ease}
.mcard{border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.28);animation:pop .22s ease}
#formModal .mcard{border-radius:24px 24px 0 0;animation:slideup .26s ease}
@media(min-width:800px){#formModal .mcard{border-radius:22px;animation:pop .22s ease}}
#fab{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#9b5cf6));box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
</style>

</head>
<body>
<div class="wrap">
<div id="viewTabs">
  <button type="button" id="calendarTab" class="on">カレンダー</button>
  <button type="button" id="notesTab">ノート</button>
</div>
<div class="card" id="authPanel" hidden>
  <h2>マイカレンダー</h2>
  <p>ログインして、予定をどの端末からでも確認しよう。</p>

  <label for="authEmail">メールアドレス</label>
  <input id="authEmail" type="email"
         placeholder="メールアドレスを入力" autocomplete="email">

  <label for="authPassword">パスワード</label>
  <input id="authPassword" type="password"
         placeholder="パスワードを入力"
         autocomplete="current-password">

  <button id="loginBtn" type="button">ログイン</button>
  <button id="signupBtn" type="button">新規登録</button>

  <p id="authMessage" role="status"></p>
  <button id="cancelAuthBtn" type="button">キャンセル</button>
</div>

<div class="card">
  <div class="head"><button id="prev">‹</button><h2 id="title"></h2><button id="next">›</button><button id="today">今日</button></div>
  <div class="grid" id="grid"></div>
</div>
<div class="card">
  <div class="modal" id="formModal" hidden><div class="mcard" id="formBox"><div style="display:flex;align-items:center;gap:8px"><h3 style="margin:0;flex:1;font-size:17px" id="selTitle"></h3><button data-closeform="1">閉じる</button></div>
  <div class="seg"><button id="mEv" class="on">予定</button><button id="mTk">タスク</button><button id="mLs">リスト</button></div>
  <label>タイトル</label><input type="text" id="fTitle" placeholder="例：レポート提出">
  <label id="dLabel">日付</label><input type="date" id="fDate">
  <div id="evOnly">
    <label>開始時間（任意）</label><input type="time" id="fTime">
    <div id="endBox"><label>終了時間（任意）</label><input type="time" id="fEnd"></div>
    <label>リマインダー</label>
    <select id="fRem"><option value="">なし</option><option value="0">開始時刻に通知</option><option value="10">10分前</option><option value="60">1時間前</option><option value="1440">1日前</option></select>
  </div>
  <div id="lsOnly" hidden><label>項目（1行に1つ）</label><textarea id="fItems" rows="4" placeholder="牛乳&#10;卵&#10;パン"></textarea></div>
  <label>場所（任意）</label><input type="text" id="fPlace" placeholder="例：天神 カフェ">
  <label>メモ（任意）</label><textarea id="fMemo" rows="3" placeholder="持ち物、URL、補足など"></textarea>
  <div style="margin-top:10px"><button class="primary" id="add">追加</button> <button id="cancel" hidden>キャンセル</button></div>
  <div id="msg" class="empty over"></div></div></div>
  <h3 style="margin-top:0">この日の予定・タスク</h3><div id="dayList"></div>
  <h3>リスト</h3><div id="listBox"></div>
  <h3>期限切れ・今後のタスク</h3><div id="taskList"></div>
  <h3>完了済み <button id="togDone" style="font-size:12px;padding:2px 8px">表示</button></h3><div id="doneList" hidden></div>
  <h3>色の設定</h3><div id="sw" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"></div>
  <h3>同期</h3><div id="sync" class="empty">この端末のみに保存中</div>
  <div style="margin-top:12px"><button id="notif">通知を許可</button> <small class="empty">ページを開いている間だけ通知されます</small></div>
</div>
</div>
  
<div class="card" id="notesView" hidden>
  <h2>ノート</h2>
  <button type="button" id="newNoteBtn">＋ 新しいノート</button>
  <input type="search" id="noteSearch" placeholder="タイトル・本文を検索">
  <div id="notesList"></div>
  <div id="noteEditor" hidden>
    <label for="noteTitle">タイトル</label>
    <input type="text" id="noteTitle" placeholder="ノートのタイトル">
    <label for="noteContent">本文</label>
    <textarea id="noteContent" rows="12" placeholder="メモや議事録を書こう"></textarea>
    <div>
      <button type="button" id="saveNoteBtn">保存</button>
      <button type="button" id="cancelNoteBtn">キャンセル</button>
    </div>
  </div>
</div>

<button id="fab" class="primary" aria-label="新規作成">＋</button>
<div class="modal" id="modal" hidden><div class="mcard" id="mCard"><div id="mBody"></div></div></div>
<script>
var KEY="mycal-v1",S={items:[]},view=new Date(),sel=ymd(new Date()),mode="ev";
  
var currentView = "calendar";

function switchView(viewName) {
  currentView = viewName;

  $("calendarTab").classList.toggle("on", viewName === "calendar");
  $("notesTab").classList.toggle("on", viewName === "notes");

  // カレンダーの表示・非表示を切り替える
  $("grid").closest(".card").hidden = viewName !== "calendar";

  // 予定やタスクの一覧が入っているカードを切り替える
  $("dayList").closest(".card").hidden = viewName !== "calendar";

  // ノート画面を切り替える
  $("notesView").hidden = viewName !== "notes";

  // カレンダーの新規作成ボタンはカレンダー画面だけで表示
  $("fab").hidden = viewName !== "calendar";
}

$("calendarTab").addEventListener("click", function() {
  switchView("calendar");
});

$("notesTab").addEventListener("click", function() {
  switchView("notes");
});

try{var raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)}catch(e){}

var ref=null,pushT=null,first=true;
var supabaseClient=null,currentUser=null,cloudReady=false;

function setSync(t){
  $("sync").textContent=t;
}


async function push() {
  if (!supabaseClient || !currentUser || !cloudReady) {
    throw new Error("同期の準備ができていません");
  }

  var result = await supabaseClient
    .from("calendar_data")
    .upsert({
      user_id: currentUser.id,
      data: S,
      updated_at: new Date().toISOString()
    });

  if (result.error) {
    throw result.error;
  }

  setSync("同期済み");
}

function save(){
  S.updated=Date.now();

  try{
    localStorage.setItem(KEY,JSON.stringify(S));
  }catch(e){}

  if(currentUser&&cloudReady){
    clearTimeout(pushT);
    pushT=setTimeout(push,500);
  }
}

/* ノート機能 */
if (!Array.isArray(S.notes)) {
  S.notes = [];
}

var editingNoteId = null;

// ノート一覧を表示
function renderNotes() {
  var list = $("notesList");
  var keyword = $("noteSearch").value.trim().toLowerCase();

  list.innerHTML = "";

  var notes = S.notes.filter(function(note) {
    return (note.title + " " + note.content)
      .toLowerCase()
      .includes(keyword);
  });

  if (notes.length === 0) {
    list.textContent = keyword
      ? "検索結果がありません"
      : "まだノートがありません";
    return;
  }

  notes.sort(function(a, b) {
  // ピン留めされたノートを先に表示
  if (a.pinned && !b.pinned) return -1;
  if (!a.pinned && b.pinned) return 1;

  // 同じ状態なら更新日時の新しい順
  return b.updated - a.updated;
});

  notes.forEach(function(note) {
    var card = document.createElement("div");
    card.style.cssText =
      "padding:12px;margin-top:8px;border:1px solid var(--line);" +
      "border-radius:12px;background:var(--card)";

    var title = document.createElement("h3");
    title.textContent = note.title || "無題のノート";
    title.style.margin = "0 0 6px";

    var content = document.createElement("p");
    content.textContent = note.content || "本文なし";
    content.style.cssText =
      "margin:0 0 10px;white-space:pre-wrap;overflow-wrap:anywhere";
    
var dateInfo = document.createElement("div");

var createdText = note.created
  ? new Date(note.created).toLocaleString("ja-JP")
  : "記録なし";

var updatedText = note.updated
  ? new Date(note.updated).toLocaleString("ja-JP")
  : "記録なし";

dateInfo.textContent =
  "作成：" + createdText + " ／ 最終更新：" + updatedText;

dateInfo.style.cssText =
  "font-size:12px;color:#777;margin-bottom:10px";


// ピン留め
var pinButton = document.createElement("button");
pinButton.type = "button";
pinButton.textContent = note.pinned ? "📍 ピン留め解除" : "📍 ピン留め";
pinButton.style.marginRight = "8px";

pinButton.addEventListener("click", function() {
  note.pinned = !note.pinned;
  save();
  renderNotes();
});

var editButton = document.createElement("button");
editButton.type = "button";
editButton.textContent = "開いて編集";
editButton.addEventListener("click", function() {
  openNote(note.id);
});

var deleteButton = document.createElement("button");
deleteButton.type = "button";
deleteButton.textContent = "削除";
deleteButton.style.marginLeft = "8px";
deleteButton.addEventListener("click", function() {
  if (!confirm("「" + (note.title || "無題のノート") + "」を削除しますか？")) {
    return;
  }
  S.notes = S.notes.filter(function(item) {
    return item.id !== note.id;
  });
  save();
  renderNotes();
});
card.appendChild(title);
card.appendChild(content);
card.appendChild(dateInfo);
card.appendChild(pinButton);
card.appendChild(editButton);
card.appendChild(deleteButton);
list.appendChild(card);
  });
}

// 新規作成・編集画面を開く
function openNote(id) {
  var note = S.notes.find(function(item) {
    return item.id === id;
  });
  editingNoteId = id || null;
  $("noteTitle").value = note ? note.title : "";
  $("noteContent").value = note ? note.content : "";
  $("noteEditor").hidden = false;
  $("noteTitle").focus();
}

// ノートを保存
function saveNote() {
  var title = $("noteTitle").value.trim();
  var content = $("noteContent").value;

  if (!title && !content.trim()) {
    alert("タイトルか本文を入力してください");
    return;
  }

  var now = Date.now();

  if (editingNoteId) {
    var note = S.notes.find(function(item) {
      return item.id === editingNoteId;
    });

    if (note) {
      note.title = title;
      note.content = content;
      note.updated = now;
    }
  } else {
    S.notes.push({
      id: String(now) + "-" + Math.random().toString(36).slice(2, 8),
      title: title,
      content: content,
      created: now,
      updated: now
    });
  }

  save();
  renderNotes();

  $("noteEditor").hidden = true;
  editingNoteId = null;
}
// 新しいノート
$("newNoteBtn").addEventListener("click", function() {
  openNote(null);
});

// 保存ボタン
$("saveNoteBtn").addEventListener("click", saveNote);

// キャンセルボタン
$("cancelNoteBtn").addEventListener("click", function() {
  $("noteEditor").hidden = true;
  editingNoteId = null;
});

// 検索
$("noteSearch").addEventListener("input", renderNotes);

// 最初の一覧表示
renderNotes();

function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function $(id){return document.getElementById(id)}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
  var y=view.getFullYear(),m=view.getMonth();
  $("title").textContent=y+"年"+(m+1)+"月";
  var g=$("grid");g.innerHTML="";
  "日月火水木金土".split("").forEach(function(d){var e=document.createElement("div");e.className="dow";e.textContent=d;g.appendChild(e)});
  var start=new Date(y,m,1-new Date(y,m,1).getDay()),td=ymd(new Date());
  for(var i=0;i<42;i++){
    var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),k=ymd(d);
    var c=document.createElement("div");
    c.className="day"+(d.getMonth()!==m?" other":"")+(k===td?" today":"")+(k===sel?" sel":"");
    var html='<div class="num">'+d.getDate()+'</div>';

      var mergedNotes = remoteNotes.slice();

      localNotes.forEach(function(localNote) {
        var index = mergedNotes.findIndex(function(remoteNote) {
          return remoteNote.id === localNote.id;
        });
        if (index === -1) {
          mergedNotes.push(localNote);
        } else if (
          (localNote.updated || 0) >
          (mergedNotes[index].updated || 0)
        ) {
          mergedNotes[index] = localNote;
        }
      });
      remote.notes = mergedNotes;

      // 端末側とクラウド側の両方にデータがある場合、
      // 自動で上書きせず、安全のため同期を止める
      var localHasData =
        Array.isArray(S.items) && S.items.length > 0;
      var remoteHasData = remote.items.length > 0;


      // クラウドに予定があり、端末側が空なら読み込む
      if (remoteHasData && !localHasData) {
        S = remote;

        try {
          localStorage.setItem(KEY, JSON.stringify(S));
        } catch (e) {}

        applyBg();
        drawSw();
        render();
      } else if (localHasData && !remoteHasData) {
        // 端末に予定があり、クラウド側が空なら
        // 端末の予定をクラウドへ保存する
        cloudReady = true;
        await push();
        return;
      } else {
        // 両方とも予定が空の場合
        S = remote;

        try {
          localStorage.setItem(KEY, JSON.stringify(S));
        } catch (e) {}

        applyBg();
        drawSw();
        render();
      }
    } else {
      // クラウドに保存データがない場合
      // 端末側のデータを初回保存する
      cloudReady = true;
      await push();
      return;
    }

       cloudReady = true;
    await push();
    setSync("同期済み");

 
} catch (error) {
  cloudReady = false;
  activeUid = null;
  currentUser = null;
  console.error(error);
  setSync("同期エラー：" + error.message);
}

}



if (
  !SUPABASE_URL.startsWith("https://") ||
  SUPABASE_URL.includes("ここに") ||
  SUPABASE_KEY.includes("ここに")
) {
  showAuth(false);
  setSync("Supabaseの接続情報を設定してください");
} else {
  supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  $("signupBtn").onclick = async function() {
    var email = $("authEmail").value.trim();
    var password = $("authPassword").value;

    if (!email || !password) {
      $("authMessage").textContent =
        "メールアドレスとパスワードを入力してください";
      return;
    }

    $("authMessage").textContent = "登録中…";

    var result = await supabaseClient.auth.signUp({
      email: email,
      password: password
    });

    if (result.error) {
      $("authMessage").textContent =
        "登録できませんでした：" + result.error.message;
      return;
    }

    if (result.data.session) {
      $("authMessage").textContent = "登録しました";
      await handleSession(result.data.session);
    } else {
      $("authMessage").textContent =
        "確認メールを送信しました。メール内のリンクを開いてからログインしてください。";
    }
  };

  $("loginBtn").onclick = async function() {
    var email = $("authEmail").value.trim();
    var password = $("authPassword").value;

    if (!email || !password) {
      $("authMessage").textContent =
        "メールアドレスとパスワードを入力してください";
      return;
    }

    $("authMessage").textContent = "ログイン中…";

    var result = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (result.error) {
      $("authMessage").textContent =
        "ログインできませんでした：" + result.error.message;
      return;
    }

    await handleSession(result.data.session);
  };

  logoutBtn.onclick = async function() {
    var result = await supabaseClient.auth.signOut();

    if (result.error) {
      setSync("ログアウトできませんでした");
      return;
    }

    // 予定データはlocalStorageに残す
    setSync("ログアウトしました");
  };

  supabaseClient.auth.onAuthStateChange(function(event, session) {
    setTimeout(function() {
      handleSession(session);
    }, 0);
  });

  supabaseClient.auth.getSession().then(function(result) {
    if (result.error) {
      console.error(result.error);
      setSync("ログイン状態を確認できませんでした");
      return;
    }

    handleSession(result.data.session);
  });
}

</script>
